name: Bump Tailscale Dependency

on:
  schedule:
    # Weekly: keep the embedded tsnet client fresh without cutting a release
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tailscale-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go/go.mod
          cache-dependency-path: tsbridge/go/go.sum

      - name: Detect latest Tailscale release
        id: latest
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::Unable to detect latest Tailscale release"
            exit 1
          fi
          CURRENT=$(grep -E '^\s+tailscale\.com v' tsbridge/go/go.mod | awk '{print $2}')
          echo "latest=$TAG" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Latest Tailscale: $TAG (pinned: $CURRENT)"

      - name: Bump go.mod
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        working-directory: tsbridge/go
        run: |
          go get "tailscale.com@${{ steps.latest.outputs.latest }}"
          go mod tidy

      - name: Commit and push
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tsbridge/go/go.mod tsbridge/go/go.sum
          git commit -m "chore(tailscale): bump tsnet to ${{ steps.latest.outputs.latest }}"
          git push origin HEAD:master || {
            echo "::warning::Push rejected (branch moved). Will retry on next schedule."
            exit 0
          }
