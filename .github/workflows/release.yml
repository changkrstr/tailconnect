name: Build & Release TailConnect

on:
  push:
    tags:
      - 'tailconnect-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for a manual build (e.g. v1.37.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#tailconnect-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building TailConnect $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go/go.mod
          cache-dependency-path: tsbridge/go/go.sum

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build tsbridge.aar
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p libs
          cd tsbridge/go
          gomobile bind \
            -target=android/arm64,android/amd64 \
            -javapkg=org.kde.kdeconnect.tsbridge \
            -androidapi=26 \
            -o ../../libs/tsbridge.aar .

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign & rename APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK=$(find build/outputs/apk/release -name "*.apk" | head -n1)
          [ -n "$APK" ] || { echo "::error::Release APK not found"; exit 1; }

          if ! unzip -l "$APK" | grep -q 'META-INF/.*\.SF'; then
            keytool -genkeypair -v -keystore release.jks -alias tailconnect \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tailconnect -keypass tailconnect \
              -dname "CN=TailConnect,O=TailConnect,C=US"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.jks -storepass tailconnect -keypass tailconnect \
              "$APK" tailconnect
          fi

          OUT="build/outputs/apk/release/TailConnect-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "Built $OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TailConnect ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## TailConnect ${{ steps.version.outputs.version }}

            KDE Connect for Android with embedded Tailscale (`tsnet`) support.

            Based on upstream KDE Connect **${{ steps.version.outputs.version }}**.

            ### Highlights
            - Native userspace Tailscale tunnel — no system VPN or root required.
            - Discovery reuses the built-in "Add device by IP" flow: enter a peer's tailnet IP (e.g. `100.x.y.z`) and it pairs like a LAN device.
            - Standalone package `io.github.changkrstr.tailconnect`, installs alongside official KDE Connect.
          files: build/outputs/apk/release/TailConnect-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
