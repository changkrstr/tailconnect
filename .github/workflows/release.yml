name: Build & Release TailConnect

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install gomobile and build tsbridge.aar
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          cd tsbridge/go
          go mod tidy
          mkdir -p ../../libs
          gomobile bind -target=android/arm64,android/amd64 -javapkg=org.kde.kdeconnect.tsbridge -androidapi=26 -o ../../libs/tsbridge.aar .
          cd ../..

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare & Sign Release APK
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          APK=$(find build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Error: Release APK not found"
            exit 1
          fi
          
          # Self-sign if not already signed
          if ! unzip -l "$APK" | grep -q "META-INF/.*\.SF"; then
            echo "Signing APK with release keystore..."
            keytool -genkey -v -keystore release.jks -alias tailconnect -keyalg RSA -keysize 2048 -validity 10000 -storepass tailconnect -keypass tailconnect -dname "CN=TailConnect,O=TailConnect,C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass tailconnect -keypass tailconnect "$APK" tailconnect
          fi
          
          OUTPUT_APK="build/outputs/apk/release/TailConnect-${TAG}.apk"
          cp "$APK" "$OUTPUT_APK"
          echo "Output APK created at: $OUTPUT_APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TailConnect ${{ github.ref_name }}"
          body: |
            ## TailConnect ${{ github.ref_name }}
            
            KDE Connect Android with native Tailscale (tsnet) integration.
            
            ### Highlights
            - **Native Tailscale Tunnel**: Connects directly via user-space `tsnet` without requiring a system VPN.
            - **Seamless Device Pairing**: Integrated into the native "Add device by IP" flow.
            - **Standalone Package**: `io.github.changkrstr.tailconnect` allows co-existing alongside official KDE Connect.
          files: build/outputs/apk/release/TailConnect-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
