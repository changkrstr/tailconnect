name: Track Upstream Tailscale

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific Tailscale tag to release (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest upstream Tailscale release
        id: check_tag
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            TAG="${{ github.event.inputs.target_tag }}"
          else
            TAG=$(curl -sL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r .tag_name)
          fi
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch upstream Tailscale tag"
            exit 1
          fi
          
          echo "Upstream Tailscale tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Check if tag already exists in local or remote
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists in this repository. Skipping."
            echo "new_tag=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream tag detected: $TAG"
            echo "new_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check_tag.outputs.new_tag == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Update Tailscale Go dependency
        if: steps.check_tag.outputs.new_tag == 'true'
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          cd tsbridge/go
          go get tailscale.com@$TAG
          go mod tidy
          cd ../..

      - name: Commit updated go.mod and push tag
        if: steps.check_tag.outputs.new_tag == 'true'
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tsbridge/go/go.mod tsbridge/go/go.sum
          git commit -m "chore(tailscale): bump tailscale to $TAG" || true
          git tag -a "$TAG" -m "TailConnect release matching upstream Tailscale $TAG"
          git push origin HEAD --follow-tags
